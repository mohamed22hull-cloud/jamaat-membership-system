<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - National Ijtema MKA & MAA Sierra Leone 2026</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;

    background:
        linear-gradient(
            rgba(0, 70, 30, 0.65),
            rgba(0, 0, 0, 0.65)
        ),
        url("background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.login-card {
    width: 92%;
    max-width: 450px;
    background: rgba(255, 255, 255, 0.97);
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    text-align: center;
}

.logo {
    font-size: 45px;
    margin-bottom: 10px;
}

h1 {
    color: #006400;
    margin: 5px 0;
}

.subtitle {
    color: #555;
    margin-bottom: 25px;
    line-height: 1.5;
}

label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #008000;
}

.login-button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 7px;
    background: #006400;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    background: #004d00;
}

.login-button:disabled {
    background: #999;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #ffecec;
    color: #b00020;
    border-radius: 7px;
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #666;
}

</style>
</head>

<body>

<div class="login-card">

    <div class="logo">🕌</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        National Ijtema MKA & MAA<br>
        Sierra Leone 2026
    </p>

    <form id="loginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="submit"
            class="login-button"
            id="loginButton">

            Login to Admin Dashboard

        </button>

    </form>

    <div
        id="errorMessage"
        class="error">
    </div>

    <div class="footer">
        Authorized Jamaat administrators only
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://pfebkzrkncpsujbbmhoq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_t5bF40Ud4fZJKtUB-c4sgQ_hZw_3aQR";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const errorMessage =
    document.getElementById("errorMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        errorMessage.style.display =
            "none";

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {
                throw error;
            }


            if (!data.user) {
                throw new Error(
                    "Login was not completed."
                );
            }


            window.location.href =
                "dashboard.html";


        } catch (error) {

            console.error(error);

            errorMessage.textContent =
                error.message ||
                "Login failed. Please check your email and password.";

            errorMessage.style.display =
                "block";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login to Admin Dashboard";
        }

    }
);

</script>

</body>
</html>
